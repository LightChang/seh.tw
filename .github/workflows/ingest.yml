# 每小時醒來一次，把「要抓誰」的判斷全部交給 transform/scheduler.mjs。
# 這裡不列 70 支來源，也不列任何間隔——排程邏輯在程式裡，不在觸發器裡（docs/scheduling.md §3）。
name: ingest

on:
  schedule:
    # 不排在整點：GitHub 文件說整點負載高，排程會延遲或被丟掉。上線當天整點排程
    # 11 小時只觸發 1 次（2026-09-15）。scheduler 自己判斷到期，分鐘數不影響邏輯。
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '強制重抓的 source id，多支用空白分隔（空白＝只抓到期的）'
        required: false

permissions:
  contents: write   # 回寫 data/ 與 src/data/
  pages: write      # 部署
  id-token: write   # deploy-pages 的 OIDC

concurrency:
  group: ingest
  cancel-in-progress: false   # 抓一半被砍會讓 schedule-state 與 raw 對不起來

jobs:
  ingest:
    # 跑在台灣的 self-hosted runner（~/actions-runner/seh.tw，launchd 常駐）。
    # 13 支政府來源擋海外 IP，GitHub 主機一律 fetch failed（2026-09-15 實測）。
    # macOS 上 upload-pages-artifact 需要 gtar（brew install gnu-tar）。
    # 這台機器關機或睡眠時排程會排隊等待，網站維持上一版。
    runs-on: [self-hosted, seh-tw]
    timeout-minutes: 60
    env:
      TZ: Asia/Taipei   # 與本機開發一致；顯示用的時間已在 format.mjs 固定台灣時間，這是保險
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50   # rebase 要看得到 origin 的近期歷史；全歷史每小時 clone 划不來
      # 用 runner 機器上的 node（nvm v26，寫在 ~/actions-runner/seh.tw/.path 最前面），
      # 不用 setup-node：在這台 Mac 上它卡在下載、10 分鐘沒有輸出。
      - name: 確認 node 版本
        run: node -e "const m = +process.versions.node.split('.')[0]; console.log(process.version); if (m < 26) process.exit(1)"
      # ~/.npm 裡有 root 擁有的快取檔（EACCES），npm 抓不到的 optional 套件會靜靜漏掉。
      # runner 用自己的快取目錄，不碰使用者的 ~/.npm。
      - run: npm ci
        env:
          npm_config_cache: ${{ runner.tool_cache }}/npm-cache

      # inputs.force 一律走 env，不內插進 run:。內插等於把使用者輸入當 shell 指令跑。
      - name: 抓取到期來源
        id: fetch
        env:
          FORCE: ${{ inputs.force }}
        run: |
          # pipefail：沒有它，scheduler 失敗會被 tee 的 exit 0 蓋掉，job 顯示成功
          set -o pipefail -o noglob
          args=(); for id in $FORCE; do args+=(--force "$id"); done   # 空白分隔可指定多支
          node transform/scheduler.mjs "${args[@]}" | tee run.log
          grep -q '^PIPELINE=1' run.log && echo 'changed=true' >> "$GITHUB_OUTPUT" || echo 'changed=false' >> "$GITHUB_OUTPUT"

      # 沒有任何來源變動就到此為止：不跑後續、不 build、不 commit、不部署
      # 手動觸發例外：一律建置並部署（第一次上線、改了版面但資料沒變時用）
      # GA 與 Search Console 的值放 repository variables（vars，不是 secrets——
      # 它們本來就會出現在每一頁的原始碼裡）。沒設就什麼都不輸出。
      - name: 轉換與建置
        if: steps.fetch.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        env:
          SEH_GA_ID: ${{ vars.SEH_GA_ID }}
          SEH_GSC_TOKEN: ${{ vars.SEH_GSC_TOKEN }}
        # links 沒過就不部署：壞連結、canonical 帶 .html 都在這裡擋
        run: |
          npm run pipeline
          npm run links

      - name: 回寫排程狀態
        run: |
          git config user.name  'seh-ingest'
          git config user.email 'ingest@seh.tw'
          git add data/ src/data/ public/
          git diff --cached --quiet || git commit -m "ingest: $(date -u +%Y-%m-%dT%H:%MZ)"
          # 併發被 concurrency 擋住了，但仍可能有人在同一時間手動推
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push

      # 部署必須跟 ingest 同一個 job。GITHUB_TOKEN 推出去的 commit 不會觸發任何
      # workflow，所以「push 觸發 deploy」那條路在這裡是死的。
      - uses: actions/configure-pages@v5
        if: steps.fetch.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
      - uses: actions/upload-pages-artifact@v3
        if: steps.fetch.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deploy
        if: steps.fetch.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
