# 建置並部署到 GitHub Pages。
#
# 抓取資料不在這裡：部分政府來源擋海外 IP，GitHub 主機抓不到（清單見 ops/host-skip.json）。
# 更新流程（2026-09-27 起）：台灣主機只抓那幾支擋海外的來源、把 raw 投遞到境外主機
# （ops/fetch-taiwan-only.sh）；境外主機的 ops/run-update.sh 收投遞、抓其餘來源、跑 pipeline／
# 測試／建置／連結檢查，有變更才 push main。這支 workflow 再把 push 上來的結果建置、檢查連結、部署。
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write      # 部署
  id-token: write   # deploy-pages 的 OIDC

concurrency:
  group: deploy
  cancel-in-progress: false   # 部署到一半被砍會留下半套產出

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Taipei   # 與本機一致；顯示用的時間已在 format.mjs 固定台灣時間，這是保險
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # pnpm/action-setup 必須在 setup-node 之前：setup-node 的 cache: pnpm
      # 要先找到 pnpm 執行檔才算得出 store 路徑。
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # 只跑 emit 之後的階段：normalize 需要 ingest/raw/，那不進版控，CI 沒有。
      # GA 與 Search Console 的值放 repository variables（vars，不是 secrets——
      # 它們本來就會出現在每一頁的原始碼裡）。沒設就什麼都不輸出。
      - name: 建置
        env:
          SEH_GA_ID: ${{ vars.SEH_GA_ID }}
          SEH_GSC_TOKEN: ${{ vars.SEH_GSC_TOKEN }}
        # test、links 沒過就不部署：測試在這裡才真的擋得住（台灣機器只抓＋轉換、不建置）
        run: |
          pnpm test
          pnpm run build
          pnpm run links

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deploy
